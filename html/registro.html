<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <link rel="stylesheet" href="../css/registro.css">
</head>

<body>

     <header class="header">
        <h2>AlterEGO</h2>
        
        <div class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    
        <nav class="nav" id="nav">
            <ul class="ul">
                <li class="li"><a class="a" href="../index.html">Inicio</a></li>
                <li class="li"><a class="a" href="about.html">Sobre nosotros</a></li>
                <li class="li"><a class="a" href="contact.html">Contacto</a></li>
                <li class="li"><a class="a" href="login.html">Iniciar sesión</a></li>
                <div class="HoraFecha">
                    <p><span id="fecha"></span></p>
                    <p >Hora: <span id="hora"></span></p>
                </div>
            </ul>
        </nav>

        
    </header>
    

    <div class="registro-container">

        <h2>Crear Cuenta</h2>

        <form class="formulario"> 

            <div class="input-group">
                <label>Nombre completo</label>
                <input type="text" placeholder="Ingresa tu nombre">
            </div>

            <div class="input-group">
                <label>Correo electrónico</label>
                <input type="email" placeholder="ejemplo@email.com">
            </div>

            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" placeholder="********">
            </div>

            <div class="input-group">
                <label>Confirmar contraseña</label>
                <input type="password" placeholder="********">
            </div>

            <button class="btn-registro" type="submit">
                Registrarse
            </button>

        </form>

        <div class="extra">
            ¿Ya tienes cuenta?
            <a href="login.html">Inicia sesión</a>
        </div>

    </div>

    <script src="../js/index.js"></script>

</body>
</html>
