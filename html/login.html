<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <!-- Header-->
    <header class="header">
        <h2>AlterEGO</h2>
        
        <div class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    
        <nav class="nav" id="nav">
            <ul class="ul">
                <li class="li"><a class="a" href="../index.html">Inicio</a></li>
                <li class="li"><a class="a" href="about.html">Sobre nosotros</a></li>
                <li class="li"><a class="a" href="contact.html">Contacto</a></li>
                <li class="li"><a class="a" href="login.html">Iniciar sesión</a></li>
                <div class="HoraFecha">
                    <p>Fecha: <span id="fecha"></span></p>
                    <p >Hora: <span id="hora"></span></p>
                    
                </div>
            </ul>
        </nav>
    </header>

    <div class="login-container">

        <h2>Iniciar Sesión</h2>

        <form class="formulario-login">

            <div class="input-group">
                 <label>Usuario</label>
                 <input type="email" id="email" placeholder="ejemplo@email.com">
             </div>

             <div class="input-group">
                 <label>Contraseña</label>
                 <input type="password" id="password" placeholder="********">
             </div>

            <div class="opciones">
                <label>
                    <input type="checkbox">
                    Recordarme
                </label>

                <a href="#">¿Olvidaste tu contraseña?</a>
            </div>

            <button class="btn-login" id="btnLogin" type="submit">
                 Entrar
             </button>

        </form>

        <div class="extra">
            ¿No tienes cuenta?
            <a href="registro.html">Crear cuenta</a>
        </div>

    </div>

    <p class="usuario">el usuario es <strong>admin</strong> y la contraseña es <strong>1234</strong></p>

    <script src="/js/index.js"></script>
</body>

</html>
