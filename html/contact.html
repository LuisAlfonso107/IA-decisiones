<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="/css/contac.css">
    <link rel="icon" href="/img/logo_alterego_azul.png">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <h2>AlterEGO</h2>
        
        <div class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    
        <nav class="nav" id="nav">
            <ul class="ul">
                <li class="li"><a class="a" href="../index.html">Inicio</a></li>
                <li class="li"><a class="a" href="about.html">Sobre nosotros</a></li>
                <li class="li"><a class="a" href="contact.html">Contacto</a></li>
                <li class="li"><a class="a" href="login.html">Iniciar sesión</a></li>
                <div class="HoraFecha">
                    <p>Fecha: <span id="fecha"></span></p>
                    <p>Hora: <span id="hora"></span></p>
                    
                </div>
            </ul>
        </nav>
    </header>

    <!-- Main -->
    <main>

        <h2 class="contacto">Contacto</h2>
        
    
        <form>
         
            <label for="localidad">Localidad</label>
            <select name="localidad" id="localidad">
                <option value="">Selecciona tu localidad</option>
                <option value="Madrid">Madrid</option>
                <option value="barcelona">Barcelona</option>
                <option value="valencia">Valencia</option>
                <option value="sevilla">Sevilla</option>
                <option value="malaga">Málaga</option>
                <option value="bilbao">Bilbao</option>
            </select>
 
            <label for="name">Nombre</label>
            <input type="text" id="name" name="name">
 
            <label for="email">Email</label>
            <input type="email" id="email" name="email">

            <label for="phone">Teléfono</label>
            <input type="tel" id="phone" name="phone">

            <label for="message">Mensaje</label>
            <textarea id="message" name="message"></textarea>

            <input type="checkbox" id="politicas" name="politicas">
            <label for="politicas">Acepto las políticas de privacidad</label>

            <button id="botonEnviar" type="submit" value="Enviar" disabled >Enviar</button>
        </form>
        
    </main>

    <!--Footer-->
    <footer>
        <h1>AlterEGO</h1>
        <p>Tu copiloto existencial</p>
        <nav>
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="../html/about.html">Sobre nosotros</a></li>
                <li><a href="../html/contact.html">Contacto</a></li>
            </ul>
        </nav>
        <p>Todos los derechos reservados © 2026 AlterEGO</p>
        
    </footer>
    
</body>

<script src="/js/index.js"></script>
</html>
