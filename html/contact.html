<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="/css/contac.css">
    <link rel="icon" href="/img/logo_alterego_azul.png">
</head>
<body>
    <!-- Header -->
    <header>
        <h1>AlterEGO</h1>
        <nav>
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="../html/about.html">Sobre nosotros</a></li>
                <li><a href="../html/contact.html">Contacto</a></li>
            </ul>
        </nav>
        
    </header>

    <!-- Main -->
    <main>

        <h2 class="contacto">Contacto</h2>
        
    
        <form>
         
            <label for="localidad">Localidad</label>
            <select name="localidad" id="localidad">
                <option value="">Selecciona tu localidad</option>
                <option value="Madrid">Madrid</option>
                <option value="barcelona">Barcelona</option>
                <option value="valencia">Valencia</option>
                <option value="sevilla">Sevilla</option>
                <option value="malaga">Málaga</option>
                <option value="bilbao">Bilbao</option>
            </select>
 
            <label for="name">Nombre</label>
            <input type="text" id="name" name="name">
 
            <label for="email">Email</label>
            <input type="email" id="email" name="email">

            <label for="phone">Teléfono</label>
            <input type="tel" id="phone" name="phone">

            <label for="message">Mensaje</label>
            <textarea id="message" name="message"></textarea>

            <input type="checkbox" id="newsletter" name="newsletter">
            <label for="newsletter">Política de privacidad</label>

            <button type="submit" value="Enviar" >Enviar</button>
        </form>
        
    </main>

    <!--Footer-->
    <footer>
        <h1>AlterEGO</h1>
        <p>Tu copiloto existencial</p>
        <nav>
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="../html/about.html">Sobre nosotros</a></li>
                <li><a href="../html/contact.html">Contacto</a></li>
            </ul>
        </nav>
        <p>Todos los derechos reservados © 2026 AlterEGO</p>
        
    </footer>
    
</body>
</html>
